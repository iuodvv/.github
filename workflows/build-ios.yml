name: Build .NET MAUI iOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App on macOS
    runs-on: macos-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد إصدار دوت نت (تأكد أنه متوافق مع إصدار مشروعك net10.0)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. تثبيت حزم وأدوات .NET MAUI
      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      # 4. بناء ونشر مشروع الآيفون
      - name: Publish iOS Project
        run: |
          dotnet publish -c Release -f net10.0-ios -p:BuildIpa=true

      # 5. رفع حزمة التطبيق الناتجة ليمكنك تحميلها
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: |
            **/bin/Release/net10.0-ios/**/*.ipa
            **/bin/Release/net10.0-ios/**/*.zip
